# Pipeline CI/CD - Github-Auto-Review
# Se déclenche à chaque push sur main et à chaque pull request vers main.

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - docs/*

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '24.x'
  imageName: 'github-auto-review'
  imageTag: '$(Build.BuildId)'
  npm_config_cache: '$(Pipeline.Workspace)/.npm'
  terraformVersion: '1.16.6'
  gitleaksVersion: '8.21.2'
  trivyVersion: '0.69.3'
  checkovVersion: '3.3.30'
  azureServiceConnection: 'sc-azure-gar'
  sonarOrganization: 'ademhmercha'
  sonarProjectKey: 'ademhmercha_Github-Auto-Review'
  acrName: 'acrgar10137'
  acrLoginServer: 'acrgar10137.azurecr.io'

stages:
  - stage: CI
    displayName: 'Intégration continue'
    jobs:
      # ------------------------------------------------------- SECRETS
      - job: Secrets
        displayName: 'Détection de secrets (Gitleaks)'
        pool:
          vmImage: ubuntu-24.04

        steps:
          # Historique complet : un secret supprimé reste lisible dans les anciens commits
          - checkout: self
            fetchDepth: 0
            displayName: "Récupérer le code et tout l'historique"

          - script: |
              set -euo pipefail
              curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v$(gitleaksVersion)/gitleaks_$(gitleaksVersion)_linux_x64.tar.gz" \
                | tar -xz -C "$(Agent.ToolsDirectory)" gitleaks
              "$(Agent.ToolsDirectory)/gitleaks" version
            displayName: 'Installer Gitleaks $(gitleaksVersion)'

          - script: |
              "$(Agent.ToolsDirectory)/gitleaks" git . \
                --redact \
                --verbose \
                --report-format sarif \
                --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif" \
                --exit-code 1
            displayName: "Analyser le code et l'historique Git"

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks.sarif'
              artifact: 'rapport-gitleaks'
            displayName: 'Publier le rapport Gitleaks'

      # ----------------------------------------------- IaC (TERRAFORM)
      - job: IaC
        displayName: 'Sécurité du code Terraform (Checkov)'
        pool:
          vmImage: ubuntu-24.04

        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Installer Python 3.12'

          - script: |
              set -euo pipefail
              python -m venv "$(Agent.TempDirectory)/checkov"
              "$(Agent.TempDirectory)/checkov/bin/pip" install --quiet "checkov==$(checkovVersion)"
              "$(Agent.TempDirectory)/checkov/bin/checkov" --version
            displayName: 'Installer Checkov $(checkovVersion)'

          - script: |
              "$(Agent.TempDirectory)/checkov/bin/checkov" \
                --directory infra \
                --framework terraform \
                --skip-download \
                --compact \
                --output cli \
                --output sarif \
                --output-file-path console,"$(Build.ArtifactStagingDirectory)/checkov.sarif"
            displayName: 'Analyser le code Terraform'

          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'rapport-checkov'
            displayName: 'Publier le rapport Checkov'

      # --------------------------------------------------------- BUILD
      - job: Build
        displayName: 'Vérifier, compiler et conteneuriser'
        dependsOn: Secrets
        pool:
          vmImage: ubuntu-24.04

        steps:
          # Historique complet : SonarQube Cloud en a besoin pour détecter le nouveau code
          - checkout: self
            fetchDepth: 0
            displayName: 'Récupérer le code'

          - task: UseNode@1
            inputs:
              version: '$(nodeVersion)'
            displayName: 'Installer Node.js $(nodeVersion)'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(npm_config_cache)'
            displayName: 'Cache des dépendances npm'

          - script: npm ci
            displayName: 'Installer les dépendances'

          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: 'sc-sonarcloud'
              organization: '$(sonarOrganization)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(sonarProjectKey)'
              cliProjectName: 'Github-Auto-Review'
              cliSources: 'src'
              extraProperties: |
                sonar.tests=src
                sonar.test.inclusions=**/*.test.js,**/*.test.jsx
                sonar.exclusions=**/*.test.js,**/*.test.jsx
                sonar.javascript.lcov.reportPaths=coverage/lcov.info
                sonar.qualitygate.wait=true
            displayName: "Préparer l'analyse SonarQube Cloud"

          - script: npm run lint
            displayName: 'Analyse du code (lint)'

          - script: npm run test:coverage
            displayName: 'Tests unitaires et couverture'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/junit.xml'
              testRunTitle: 'Tests unitaires (Vitest)'
              failTaskOnFailedTests: false
            displayName: 'Publier les résultats des tests'

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: 'coverage/cobertura-coverage.xml'
            displayName: 'Publier la couverture de code'

          - task: SonarCloudAnalyze@3
            displayName: 'Analyser le code (SonarQube Cloud)'

          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'Publier le résultat du quality gate'

          # Bloquant : le code de ces dépendances est livré aux utilisateurs
          - script: npm audit --omit=dev --audit-level=high
            displayName: 'Audit des dépendances de production (bloquant)'

          # Informatif : outils de build et de test, jamais livrés
          - script: npm audit --audit-level=high
            displayName: 'Audit de toutes les dépendances (informatif)'
            continueOnError: true

          - script: npm run build
            displayName: 'Build de production'

          - script: |
              docker build \
                -f docker/Dockerfile \
                -t $(imageName):$(imageTag) \
                .
            displayName: "Construire l'image Docker"

          # ---------------------------------------------- SCAN DE L'IMAGE
          - script: |
              set -euo pipefail
              cd "$(Agent.TempDirectory)"
              base="https://github.com/aquasecurity/trivy/releases/download/v$(trivyVersion)"
              archive="trivy_$(trivyVersion)_Linux-64bit.tar.gz"
              curl -fsSLO "$base/$archive"
              curl -fsSLO "$base/trivy_$(trivyVersion)_checksums.txt"
              # Vérifie que l'archive est exactement celle publiée par l'éditeur
              grep " $archive\$" "trivy_$(trivyVersion)_checksums.txt" | sha256sum -c -
              tar -xzf "$archive" -C "$(Agent.ToolsDirectory)" trivy
              "$(Agent.ToolsDirectory)/trivy" --version
              echo "##vso[task.setvariable variable=trivyInstalled]true"
            displayName: 'Installer Trivy $(trivyVersion) (empreinte vérifiée)'

          - script: |
              "$(Agent.ToolsDirectory)/trivy" image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --format table \
                $(imageName):$(imageTag)
            displayName: "Scanner l'image (bloquant sur HIGH et CRITICAL)"

          - script: |
              "$(Agent.ToolsDirectory)/trivy" image \
                --scanners vuln \
                --format sarif \
                --output "$(Build.ArtifactStagingDirectory)/trivy-image.sarif" \
                $(imageName):$(imageTag)
            condition: and(succeededOrFailed(), eq(variables['trivyInstalled'], 'true'))
            displayName: 'Rapport complet Trivy (toutes sévérités)'

          - task: PublishPipelineArtifact@1
            condition: and(succeededOrFailed(), eq(variables['trivyInstalled'], 'true'))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/trivy-image.sarif'
              artifact: 'rapport-trivy-image'
            displayName: 'Publier le rapport Trivy'

          - script: |
              docker run -d --name smoke -p 8080:8080 $(imageName):$(imageTag)
              for i in $(seq 1 15); do
                if curl -fs http://localhost:8080/healthz; then
                  echo "Le conteneur répond correctement."
                  exit 0
                fi
                sleep 2
              done
              echo "Le conteneur ne répond pas, voici ses logs :"
              docker logs smoke
              exit 1
            displayName: 'Smoke test du conteneur'

          # ------------------------------------- PUBLICATION DE L'IMAGE
          # Uniquement sur main (pas sur les pull requests), et seulement si
          # toutes les barrières précédentes sont passées.
          - task: AzureCLI@2
            name: publish
            displayName: "Publier l'image dans le registre ACR"
            condition: |
              and(
                succeeded(),
                eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                ne(variables['Build.Reason'], 'PullRequest')
              )
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Tag unique et traçable : numéro de build + commit court
                tag="$(Build.BuildId)-${BUILD_SOURCEVERSION:0:7}"
                remote="$(acrLoginServer)/$(imageName):${tag}"

                # Connexion au registre avec l'identité OIDC du pipeline (aucun mot de passe)
                az acr login --name "$(acrName)"

                docker tag "$(imageName):$(imageTag)" "$remote"
                docker push "$remote"

                digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$remote")"
                echo "Image publiée : $remote"
                echo "Empreinte     : $digest"

                # Rend le tag disponible pour les stages de déploiement
                echo "##vso[task.setvariable variable=imageTag;isOutput=true]$tag"
                # Étiquette l'exécution du pipeline avec la version publiée
                echo "##vso[build.addbuildtag]image-$tag"

  # ------------------------------------------------------------------ INFRA
  # Ordre imposé : shared (registre et plateforme), puis dev, puis prod

  - template: templates/terraform.yml
    parameters:
      name: shared
      adoEnvironment: infra-shared
      dependsOn: [CI]

  - template: templates/terraform.yml
    parameters:
      name: dev
      adoEnvironment: infra-dev
      dependsOn: [Infra_shared]

  - template: templates/terraform.yml
    parameters:
      name: prod
      adoEnvironment: infra-prod
      dependsOn: [Infra_dev]

  # ------------------------------------------------------------ DÉPLOIEMENT DEV
  # Déploie en dev l'image publiée par le stage CI, puis la teste sur son URL réelle.
  # Uniquement sur main, jamais pour une pull request.
  - stage: Deploy_dev
    displayName: 'Déploiement dev'
    dependsOn: [CI, Infra_dev]
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    variables:
      # Tag publié par l'étape "publish" du job Build (stage CI)
      releaseTag: $[ stageDependencies.CI.Build.outputs['publish.imageTag'] ]
      containerApp: 'ca-gar-dev'
      resourceGroup: 'rg-gar-dev'

    jobs:
      - deployment: Deploy
        displayName: 'Déployer en dev'
        environment: app-dev
        pool:
          vmImage: ubuntu-24.04
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Déployer la nouvelle image'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      if [ -z "$(releaseTag)" ]; then
                        echo "##vso[task.logissue type=error]Aucun tag d'image reçu du stage CI."
                        exit 1
                      fi

                      az extension add --name containerapp --upgrade --only-show-errors

                      image="$(acrLoginServer)/$(imageName):$(releaseTag)"
                      echo "Déploiement de $image sur $(containerApp)"

                      # Crée une nouvelle révision nommée d'après la version déployée
                      az containerapp update \
                        --name "$(containerApp)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$image" \
                        --revision-suffix "v$(releaseTag)" \
                        --output none

                      revision="$(az containerapp show --name "$(containerApp)" --resource-group "$(resourceGroup)" --query properties.latestRevisionName -o tsv)"
                      echo "Nouvelle révision : $revision"

                - task: AzureCLI@2
                  displayName: "Smoke test sur l'URL réelle"
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      az extension add --name containerapp --upgrade --only-show-errors

                      fqdn="$(az containerapp show --name "$(containerApp)" --resource-group "$(resourceGroup)" --query properties.configuration.ingress.fqdn -o tsv)"
                      url="https://${fqdn}/healthz"
                      echo "Test de $url"

                      # Le dev peut être éteint (0 instance) : on laisse le temps au démarrage à froid
                      for i in $(seq 1 30); do
                        if curl -fsS --max-time 10 "$url"; then
                          echo "L'application de dev répond correctement : https://${fqdn}"
                          exit 0
                        fi
                        echo "Tentative $i : pas encore de réponse, nouvel essai dans 10 secondes..."
                        sleep 10
                      done

                      echo "##vso[task.logissue type=error]L'application de dev ne répond pas après 5 minutes."
                      exit 1

  # ----------------------------------------------------- DÉPLOIEMENT PROD
  # Blue-green : la nouvelle version (green) démarre avec 0 % du trafic, est testée
  # sur l'URL de sa révision, puis reçoit 100 % du trafic. L'ancienne (blue) reste
  # active pour un retour arrière instantané.
  # Requiert l'approbation configurée sur l'environnement Azure DevOps "app-prod".
  - stage: Deploy_prod
    displayName: 'Déploiement prod (blue-green)'
    dependsOn: [CI, Deploy_dev, Infra_prod]
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    variables:
      releaseTag: $[ stageDependencies.CI.Build.outputs['publish.imageTag'] ]
      containerApp: 'ca-gar-prod'
      resourceGroup: 'rg-gar-prod'

    jobs:
      - deployment: Deploy
        displayName: 'Déployer en prod (blue-green)'
        environment: app-prod
        pool:
          vmImage: ubuntu-24.04
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Blue-green : déployer, tester, basculer'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      app="$(containerApp)"
                      rg="$(resourceGroup)"

                      if [ -z "$(releaseTag)" ]; then
                        echo "##vso[task.logissue type=error]Aucun tag d'image reçu du stage CI."
                        exit 1
                      fi

                      az extension add --name containerapp --upgrade --only-show-errors

                      image="$(acrLoginServer)/$(imageName):$(releaseTag)"
                      green="${app}--v$(releaseTag)"

                      # ---------- 1. Identifier la version actuelle (blue)
                      blue="$(az containerapp ingress traffic show --name "$app" --resource-group "$rg" \
                        --query "[?weight > \`0\`].revisionName | [0]" -o tsv)"
                      if [ -z "$blue" ] || [ "$blue" = "None" ]; then
                        # Le trafic suit encore "la dernière révision" : on récupère son nom
                        blue="$(az containerapp show --name "$app" --resource-group "$rg" \
                          --query properties.latestReadyRevisionName -o tsv)"
                      fi
                      echo "Version actuelle (blue) : $blue"
                      echo "Nouvelle version (green) : $green"

                      if [ "$blue" = "$green" ]; then
                        echo "Cette version est déjà en production, rien à faire."
                        exit 0
                      fi

                      # ---------- 2. Figer 100 % du trafic sur blue
                      az containerapp ingress traffic set --name "$app" --resource-group "$rg" \
                        --revision-weight "${blue}=100" --output none
                      echo "Trafic figé sur blue."

                      # ---------- 3. Déployer green (0 % du trafic)
                      az containerapp update --name "$app" --resource-group "$rg" \
                        --image "$image" --revision-suffix "v$(releaseTag)" --output none
                      echo "Green déployée, sans trafic."

                      # ---------- 4. Attendre que green soit en bonne santé
                      for i in $(seq 1 30); do
                        health="$(az containerapp revision show --name "$app" --resource-group "$rg" \
                          --revision "$green" --query properties.healthState -o tsv)"
                        echo "Santé de green : $health"
                        [ "$health" = "Healthy" ] && break
                        if [ "$i" -eq 30 ]; then
                          echo "##vso[task.logissue type=error]Green n'est pas en bonne santé. Blue continue de servir 100 % du trafic."
                          exit 1
                        fi
                        sleep 10
                      done

                      # ---------- 5. Tester green sur l'URL de sa révision
                      greenFqdn="$(az containerapp revision show --name "$app" --resource-group "$rg" \
                        --revision "$green" --query properties.fqdn -o tsv)"
                      echo "Test de green : https://${greenFqdn}/healthz"
                      ok=false
                      for i in $(seq 1 12); do
                        if curl -fsS --max-time 10 "https://${greenFqdn}/healthz"; then ok=true; break; fi
                        sleep 5
                      done
                      if [ "$ok" != "true" ]; then
                        echo "##vso[task.logissue type=error]Green ne répond pas. Blue continue de servir 100 % du trafic."
                        exit 1
                      fi

                      # ---------- 6. Basculer 100 % du trafic vers green
                      az containerapp ingress traffic set --name "$app" --resource-group "$rg" \
                        --revision-weight "${green}=100" "${blue}=0" --output none
                      echo "Trafic basculé : 100 % sur green."

                      # ---------- 7. Vérifier l'URL principale
                      fqdn="$(az containerapp show --name "$app" --resource-group "$rg" \
                        --query properties.configuration.ingress.fqdn -o tsv)"
                      ok=false
                      for i in $(seq 1 12); do
                        if curl -fsS --max-time 10 "https://${fqdn}/healthz"; then ok=true; break; fi
                        sleep 5
                      done
                      if [ "$ok" != "true" ]; then
                        echo "##vso[task.logissue type=error]L'URL principale ne répond pas : retour du trafic vers blue."
                        az containerapp ingress traffic set --name "$app" --resource-group "$rg" \
                          --revision-weight "${blue}=100" "${green}=0" --output none
                        exit 1
                      fi

                      # ---------- 8. Garder blue pour le rollback, désactiver le reste
                      for rev in $(az containerapp revision list --name "$app" --resource-group "$rg" \
                          --query "[?properties.active].name" -o tsv); do
                        if [ "$rev" != "$green" ] && [ "$rev" != "$blue" ]; then
                          echo "Désactivation de l'ancienne révision : $rev"
                          az containerapp revision deactivate --name "$app" --resource-group "$rg" \
                            --revision "$rev" --output none
                        fi
                      done

                      echo "Déploiement terminé : https://${fqdn}"
                      echo "En production : $green | Prête pour un rollback : $blue"
                      echo "##vso[build.addbuildtag]prod-$(releaseTag)"