# Template : plan puis apply Terraform pour un environnement (shared, dev ou prod)
#
# - Le plan tourne à chaque exécution (push et pull request).
# - L'apply ne tourne que sur main, hors pull request, et seulement si le plan
#   contient des changements. Il passe par un environnement Azure DevOps, ce qui
#   permet d'exiger une approbation manuelle (pour la prod).
# - Authentification : service connection OIDC (Workload Identity Federation),
#   aucun secret stocké. Terraform utilise la session Azure CLI ouverte par AzureCLI@2.

parameters:
  - name: name
    type: string
  - name: adoEnvironment
    type: string
  - name: dependsOn
    type: object
    default: []

stages:
  - stage: Infra_${{ parameters.name }}
    displayName: 'Infra ${{ parameters.name }}'
    dependsOn: ${{ parameters.dependsOn }}
    variables:
      workingDir: '$(Build.SourcesDirectory)/infra/environments/${{ parameters.name }}'
      TF_IN_AUTOMATION: 'true'

    jobs:
      # ---------------------------------------------------------------- PLAN
      - job: Plan
        displayName: 'Terraform plan (${{ parameters.name }})'
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            fetchDepth: 1

          - script: |
              set -euo pipefail
              curl -sSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -oq terraform.zip -d "$(Agent.ToolsDirectory)/terraform"
              echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/terraform"
            displayName: 'Installer Terraform $(terraformVersion)'

          - task: AzureCLI@2
            name: plan
            displayName: 'fmt, validate et plan'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(workingDir)
              inlineScript: |
                set -euo pipefail
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                terraform version
                terraform fmt -check -recursive "$(Build.SourcesDirectory)/infra"
                terraform init -input=false
                terraform validate

                # -detailed-exitcode : 0 = aucun changement, 1 = erreur, 2 = changements
                set +e
                terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan
                code=$?
                set -e

                if [ "$code" -eq 1 ]; then
                  echo "##vso[task.logissue type=error]Le plan Terraform a échoué."
                  exit 1
                fi

                if [ "$code" -eq 2 ]; then hasChanges=true; else hasChanges=false; fi
                echo "Changements à appliquer : $hasChanges"
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]$hasChanges"

          - task: PublishPipelineArtifact@1
            displayName: 'Publier le plan'
            condition: and(succeeded(), eq(variables['plan.hasChanges'], 'true'))
            inputs:
              targetPath: '$(workingDir)/tfplan'
              artifact: 'tfplan-${{ parameters.name }}'

      # --------------------------------------------------------------- APPLY
      - deployment: Apply
        displayName: 'Terraform apply (${{ parameters.name }})'
        dependsOn: Plan
        condition: |
          and(
            succeeded(),
            eq(dependencies.Plan.outputs['plan.hasChanges'], 'true'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main'),
            ne(variables['Build.Reason'], 'PullRequest')
          )
        environment: ${{ parameters.adoEnvironment }}
        pool:
          vmImage: ubuntu-24.04
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - download: current
                  artifact: 'tfplan-${{ parameters.name }}'

                - script: |
                    set -euo pipefail
                    curl -sSLo terraform.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
                    unzip -oq terraform.zip -d "$(Agent.ToolsDirectory)/terraform"
                    echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/terraform"
                  displayName: 'Installer Terraform $(terraformVersion)'

                - task: AzureCLI@2
                  displayName: 'Terraform apply'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(workingDir)
                    inlineScript: |
                      set -euo pipefail
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      terraform init -input=false
                      # On applique exactement le plan relu et publié à l'étape précédente
                      terraform apply -input=false -lock-timeout=5m "$(Pipeline.Workspace)/tfplan-${{ parameters.name }}/tfplan"